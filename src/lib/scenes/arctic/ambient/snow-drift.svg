  <path d="M4 56 C 40 53, 62 20, 108 18 C 160 16, 186 50, 216 56 C 172 60.5, 48 60.5, 4 56 Z" fill="#d6e2ee"/>
  <path d="M138.9 21.2 C 171.6 29.6, 192.6 51.3, 216 56 C 203.7 57.3, 185.1 58.2, 163.7 58.7 C 165 46, 158 31, 138.9 21.2 Z" fill="#8ea8c6" opacity="0.35"/>
  <path d="M33.6 46.8 C 55.4 36, 75.8 19.4, 108 18 C 119.4 17.6, 129.6 18.9, 138.9 21.2 C 118 22, 96 23, 76 30 C 60 35, 46 41, 33.6 46.8 Z" fill="#ffffff" opacity="0.7"/>
</svg>
