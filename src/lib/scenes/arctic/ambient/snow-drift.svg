<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60">
  <!-- A drift of snow heaped by the wind into a long, low mound, lit from
       above and shaded on its lee side. Both ends feather out flat into the
       snowfield, and the base curves a little toward the viewer, so the
       drift sits on the snow rather than being cut off along a line. The
       shade and highlight run along the drift's own outline. Rooted on the
       bottom edge. -->
